<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:type" content="website" />

    />
    <meta
      property="og:description"
      content="Portfolio of Nguyen Gia Bao, a Backend Developer and Database-focused Developer specializing in SQL Server, T-SQL, Stored Procedures, and backend web systems."
    />
    <meta property="og:locale" content="en_US" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var key = "giabao-portfolio-theme";
          var stored = window.localStorage.getItem(key);
          var pref =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = pref === "system" ? (prefersDark ? "dark" : "light") : pref;
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
        } catch (e) {
          // Ignore storage access errors in restricted environments
        }
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
